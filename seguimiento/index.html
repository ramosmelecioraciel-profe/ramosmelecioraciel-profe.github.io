<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seguimiento">
<title>Seguimiento de alumnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--board:#1d3557;--chalk:#f1ede3;--paper:#faf8f3;--card:#fff;--ink:#16202e;--ink2:#5a6474;--line:#ddd7ca;
--A:#15803d;--F:#c62828;--R:#d97706;--J:#2563eb;--warn:#fff4d6;--bad:#fde2e2;
--f-body:'Nunito',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:#1d4ed8}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:var(--board);color:var(--chalk);padding:10px 12px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.subt{max-width:1000px;margin:0 auto;padding:12px 16px 0;font-size:20px;font-weight:800}
.subt:empty{display:none}
.top h1{flex:1;min-width:0;margin:0;font-size:17px;line-height:1.2;font-weight:800;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.iconbtn{background:transparent;border:0;color:var(--chalk);font-size:20px;width:40px;height:40px;border-radius:10px;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.sync{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.ok{background:#1f7a4d}.sync.off{background:#9a5b00}.sync.err{background:#b42318}
main{max-width:1000px;margin:0 auto;padding:14px 16px 90px}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.muted{color:var(--ink2);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px;cursor:pointer}
.gcard:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.gcard .mat{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.gcard .nom{font-size:22px;font-weight:800;margin:2px 0 6px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink2)}
.kv b{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--board);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.xl{background:#1f7a4d}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{background:#b42318}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
textarea.in{min-height:110px;resize:vertical}
.in:focus-visible,.btn:focus-visible,.seg button:focus-visible,.tab:focus-visible{outline:3px solid #4f8cff;outline-offset:1px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2);text-decoration:none}
.tab[aria-current="page"],.tab.on{background:var(--board);border-color:var(--board);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--bad);color:#7f1d1d;white-space:nowrap}
.chip.ok{background:#dcfce7;color:#14532d}
.chip.inf{background:#e0ecff;color:#1e3a8a}
.chip.pen{background:#ffe4e4;color:#7f1d1d;font-weight:700;white-space:normal}
.cnt{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.cnt span{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.lst{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.al{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.al:last-child{border-bottom:0}
.al .n{font-family:var(--f-mono);font-size:12px;color:var(--ink2);width:22px;text-align:right;flex:none}
.al .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.seg{display:flex;gap:4px;flex:none}
.seg button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;cursor:pointer;color:var(--ink2)}
.seg button.on{color:#fff;border-color:transparent}
.seg button.on[data-c="A"]{background:var(--A)}.seg button.on[data-c="F"]{background:var(--F)}.seg button.on[data-c="R"]{background:var(--R)}.seg button.on[data-c="J"]{background:var(--J)}
@media (max-width:420px){.seg button{width:36px}.al{gap:6px;padding:8px 6px}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f3efe6;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2)}
td.num,th.num{text-align:right;font-family:var(--f-mono)}
td.nm{white-space:normal;min-width:160px;font-weight:600}
td.sum{background:#f8f5ee}
td.empty{background:#ffe4e4}
tr.click{cursor:pointer}tr.click:hover td{background:#f8f5ee}
.low{color:#b42318;font-weight:800}
.cal{display:inline-block;min-width:30px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:800}
.cal.rep{background:#fde047}
.ninp{width:70px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;text-align:right;font-family:var(--f-mono);background:var(--paper)}
.tbtn{width:40px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;flex:none;filter:grayscale(1);opacity:.55}
.tbtn.on{background:#fde68a;border-color:#d97706;filter:none;opacity:1}
.ninp.bad{border-color:#b42318;background:#fff1f1}
.act{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.act .grow{flex:1;min-width:0}
.act .tag{font-family:var(--f-mono);font-size:12px;font-weight:700;background:#eef2f7;border-radius:6px;padding:2px 6px;flex:none}
.act.exam{border-left:5px solid #7c3aed}
.bar{height:8px;border-radius:9px;background:#ece7db;overflow:hidden}.bar i{display:block;height:100%;background:var(--A)}
.obs{border-left:4px solid var(--c,#94a3b8);padding:6px 10px;margin:8px 0;background:var(--card);border-radius:0 10px 10px 0}
.obs .h{font-size:12px;font-weight:800;color:var(--ink2)}
.banner{background:var(--warn);border-bottom:1px solid #f0d58a;padding:10px 16px}
.banner .in2{max-width:1000px;margin:0 auto}
.note{background:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;transition:transform .25s;max-width:90vw;z-index:9}
#toast.show{transform:translateX(-50%) translateY(0)}
.stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:24px;font-family:var(--f-mono)}
.stat span{font-size:12px;color:var(--ink2);font-weight:700}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
summary{font-weight:800;cursor:pointer}
.empty-st{text-align:center;padding:30px 10px;color:var(--ink2)}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <button id="back" class="iconbtn" aria-label="Regresar" hidden>←</button>
  <h1 id="ttl">Seguimiento de alumnos</h1>
  <span id="sync" class="sync" role="status"></span>
  <button id="cfg" class="iconbtn" aria-label="Conexión y respaldo">⚙</button>
</header>
<div id="banner"></div>
<div id="subt" class="subt"></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const LS='seg_rrm_datos', LSC='seg_rrm_conf';
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy=()=>iso(new Date());
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'], MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fcorta=f=>{if(!f)return '';const [y,m,d]=f.split('-').map(Number);const D=new Date(y,m-1,d);return DIAS[D.getDay()]+' '+d+' '+MESES[m-1];};
const MAT={PM1:{n:'Pensamiento Matemático I',c:'#2563eb'},HC:{n:'Hoja de Cálculo Aplicada',c:'#15803d'}};
const PALETA=['#2563eb','#15803d','#7c3aed','#c2410c','#0e7490','#be185d','#4d7c0f','#a16207'];
const matNom=m=>MAT[m]?MAT[m].n:m;
const matCol=m=>{if(MAT[m])return MAT[m].c;let h=0;for(const ch of String(m))h=(h*31+ch.charCodeAt(0))>>>0;return PALETA[h%PALETA.length];};
const matCorto=m=>{const n=matNom(m),ws=n.split(/\s+/).filter(w=>w.length>3||/^[IVX]+$/.test(w));if(n.length<=18)return n;
  return ws.map(w=>/^[IVX]+$/.test(w)?' '+w:w[0].toUpperCase()).join('').trim();};
const claveGrupo=g=>normal(g.nombre)+'|'+normal(g.semestre||'');
const hermanos=g=>S.grupos.filter(x=>x!==g&&claveGrupo(x)===claveGrupo(g));
function asignaturasUsadas(){const v=new Set(['Pensamiento Matemático I','Hoja de Cálculo Aplicada']);(S.grupos||[]).forEach(g=>v.add(matNom(g.materia)));return [...v].sort((a,b)=>a.localeCompare(b,'es'));}
function alumnoEnHermanos(g,fn){   // aplica un cambio de la lista de alumnos a las demás asignaturas del mismo grupo
  for(const h of hermanos(g))fn(h);
}
const TIPOS={Académica:'#2563eb',Conducta:'#c62828',Positiva:'#15803d','Padres / tutoría':'#7c3aed',Otra:'#64748b'};
const f1=x=>x==null?'—':(Math.round(x*10)/10).toFixed(1);
const nombreCmp=(a,b)=>a.nombre.localeCompare(b.nombre,'es',{sensitivity:'base'});
const PLANTILLA_URL='';   // enlace "Hacer una copia" de la Hoja de Google plantilla
const MAX_ACT=9, MAX_AL=45;   // espacios de tu formato de Excel
const PERIODOS={1:{ini:'2026-09-01',fin:'2026-10-04'},2:{ini:'2026-10-05',fin:'2026-11-08'},3:{ini:'2026-11-09',fin:'2026-12-18'}};
const nuevosPeriodos=()=>JSON.parse(JSON.stringify(PERIODOS));
const diaAntes=f=>{const [y,m,d]=f.split('-').map(Number);return iso(new Date(y,m-1,d-1));};
const PEN0={tipo:'pct',v:80};

/* ---------- estado ---------- */
let S,C,seq=0,ocupado=false,conflicto=null,red=null;
function blank(){return {v:2,grupos:[]};}
try{S=JSON.parse(localStorage.getItem(LS))||blank();}catch(e){S=blank();}
try{C=JSON.parse(localStorage.getItem(LSC))||{};}catch(e){C={};}
C.rev=C.rev||0;
function migrar(d){
  (d.grupos||[]).forEach(g=>{
    if(!g.periodos){g.periodos=nuevosPeriodos();const I=g.inicios||{};
      if(I[2]){g.periodos[1].fin=diaAntes(I[2]);g.periodos[2].ini=I[2];}
      if(I[3]){g.periodos[2].fin=diaAntes(I[3]);g.periodos[3].ini=I[3];}}
    for(let q=1;q<=4;q++)g.periodos[q]=g.periodos[q]||{ini:'',fin:''};
    delete g.inicios;g.pen=g.pen||{};
    if(g.semestre==null)g.semestre='';
    g.acts=(g.acts||[]).map(a=>Object.assign({tipo:'act'},a));
    g.extra=g.extra||{};g.obs=g.obs||[];g.asis=g.asis||{};g.pond=g.pond||{};
    delete g.crit;
  });
  d.v=2;return d;
}
S=migrar(S);
function persist(){try{localStorage.setItem(LS,JSON.stringify(S));localStorage.setItem(LSC,JSON.stringify(C));}catch(e){toast('No se pudo guardar en este dispositivo');}}
let tSub=null;
function cambio(){C.dirty=true;seq++;persist();estado();clearTimeout(tSub);tSub=setTimeout(subir,1500);}

/* ---------- sincronización con tu Hoja de Google ---------- */
async function api(body){
  const r=await fetch(C.url,{method:'POST',body:JSON.stringify(Object.assign({clave:C.clave},body))});
  const t=await r.text();try{return JSON.parse(t);}catch(e){throw new Error('respuesta');}
}
function estado(){
  const el=$('#sync');let t,c='';
  if(!C.url)t='Solo este equipo';
  else if(conflicto){t='Revisar cambios';c='err';}
  else if(red==='clave'){t='Clave incorrecta';c='err';}
  else if(ocupado)t='Guardando…';
  else if(red==='off'){t=C.dirty?'Sin internet · guardado aquí':'Sin internet';c='off';}
  else if(C.dirty)t='Por guardar…';
  else{t='Guardado ✓';c='ok';}
  el.textContent=t;el.className='sync '+c;
}
async function bajar(){
  if(!C.url){estado();return;}
  if(ocupado)return;
  ocupado=true;estado();
  try{
    const r=await api({accion:'cargar'});
    ocupado=false;
    if(!r.ok){red=r.error==='clave'||r.error==='sinclave'?'clave':'off';estado();return;}
    red=null;const srev=r.rev||0;
    if(C.dirty){
      if(srev===C.rev)subir();else if(srev>C.rev){conflicto=r;mostrarConflicto();}
    }else if(srev>C.rev||(srev===0&&!S.grupos.length)){
      if(r.datos)S=migrar(r.datos);
      C.rev=srev;persist();render();
    }else if(srev===0&&S.grupos.length){C.dirty=true;C.rev=0;subir();}
  }catch(e){ocupado=false;red='off';}
  estado();
}
async function subir(forzar){
  if(!C.url||!C.dirty||ocupado||(conflicto&&!forzar)){estado();return;}
  ocupado=true;estado();const mio=seq;
  try{
    const r=await api({accion:'guardar',base:forzar?-1:C.rev,datos:S});
    red=null;
    if(r.ok){C.rev=r.rev;if(seq===mio)C.dirty=false;conflicto=null;$('#banner').innerHTML='';persist();}
    else if(r.error==='conflicto'){conflicto=r;mostrarConflicto();}
    else red=r.error==='clave'||r.error==='sinclave'?'clave':'off';
  }catch(e){red='off';}
  ocupado=false;estado();
  if(C.dirty&&!conflicto&&red!=='clave'){clearTimeout(tSub);tSub=setTimeout(subir,red==='off'?30000:1500);}
}
function mostrarConflicto(){
  $('#banner').innerHTML='<div class="banner"><div class="in2"><b>Hay cambios hechos en otro dispositivo</b> que no están en este. ¿Con cuáles te quedas?<div class="row" style="margin-top:8px"><button class="btn sm" id="cf-srv">Usar los del otro dispositivo</button><button class="btn sm sec" id="cf-loc">Quedarme con los de aquí</button></div></div></div>';
  $('#cf-srv').onclick=()=>{S=migrar(conflicto.datos||blank());C.rev=conflicto.rev;C.dirty=false;conflicto=null;persist();$('#banner').innerHTML='';render();estado();};
  $('#cf-loc').onclick=()=>{conflicto=null;$('#banner').innerHTML='';C.dirty=true;subir(true);};
  estado();
}
window.addEventListener('online',()=>{red=null;bajar();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!C.dirty)bajar();});

/* ---------- cálculos (mismas reglas que tu formato de Excel) ---------- */
const grupo=id=>S.grupos.find(g=>g.id===id);
const activos=g=>g.alumnos.filter(a=>!a.baja).sort(nombreCmp);
function parcialDe(g,f){let p=1;
  for(let q=1;q<=g.parciales;q++){const r=g.periodos[q]||{};if(r.ini&&r.fin&&f>=r.ini&&f<=r.fin)return q;}
  for(let q=1;q<=g.parciales;q++){const r=g.periodos[q]||{};if(r.ini&&f>=r.ini)p=q;}return p;}
function rango(g,p){return g.periodos[p]||{ini:'',fin:''};}
const pHoy=g=>parcialDe(g,hoy());
function asis(g,aid,p){
  let A=0,F=0,R=0,J=0;
  for(const f in g.asis){if(p&&parcialDe(g,f)!==p)continue;const c=g.asis[f].m[aid];
    if(c==='A')A++;else if(c==='F')F++;else if(c==='R')R++;else if(c==='J')J++;}
  const tot=A+F+R+J;return {A,F,R,J,tot,pct:tot?A/tot*100:null};   // % = P/(P+F+R+J), como tu hoja
}
function seguidas(g,aid){let n=0;for(const f of Object.keys(g.asis).sort().reverse()){const c=g.asis[f].m[aid];if(!c||c==='J')continue;if(c==='F')n++;else break;}return n;}
const actsP=(g,p)=>g.acts.filter(a=>a.parcial===p&&a.tipo!=='exam');
const examP=(g,p)=>g.acts.find(a=>a.parcial===p&&a.tipo==='exam');
const esNum=v=>typeof v==='number'&&isFinite(v);
const pondA=(g,p)=>{const v=(g.pond||{})[p];return esNum(v)?v:70;};      // % de actividades (el examen es el resto)
const exMax=ex=>esNum(ex.max)?ex.max:30;
const actMax=a=>esNum(a.max)&&a.max>0?a.max:10;                 // se califica sobre…
function valores(g,p){   // puntos que vale cada actividad (las "automáticas" se reparten lo que falta)
  const ac=actsP(g,p),pa=pondA(g,p),fij=ac.filter(a=>esNum(a.valor)),aut=ac.filter(a=>!esNum(a.valor));
  const sumF=fij.reduce((s,a)=>s+a.valor,0),resto=Math.max(0,pa-sumF),cada=aut.length?resto/aut.length:0;
  const v={};ac.forEach(a=>v[a.id]=esNum(a.valor)?a.valor:cada);
  return {v,pa,sumF,resto,nAut:aut.length,total:sumF+cada*aut.length};
}
const fpt=x=>{const r=Math.round(x*100)/100;return String(r);};
const penParcial=(g,p)=>(g.pen||{})[p]||PEN0;
const reglaDe=(g,a)=>a.pen||penParcial(g,a.parcial);
const REGLAS={pct:'Vale el % de su calificación',max:'Calificación máxima (sobre 10)',resta:'Restar puntos (sobre 10)',nada:'Sin penalización (solo registrar)'};
function reglaTxt(r){return r.tipo==='pct'?'vale el '+r.v+' %':r.tipo==='max'?'máximo '+r.v+' de 10':r.tipo==='resta'?'menos '+r.v+' de 10':'sin penalización';}
function reglaHtml(id,r,heredable){
  return '<div class="row">'+'<select class="in" id="'+id+'-t" style="width:auto">'+(heredable?'<option value="">Igual que el parcial</option>':'')+Object.keys(REGLAS).map(k=>'<option value="'+k+'"'+(r&&r.tipo===k?' selected':'')+'>'+REGLAS[k]+'</option>').join('')+'</select>'+
    '<input class="ninp" id="'+id+'-v" inputmode="decimal" value="'+(r&&r.tipo!=='nada'?r.v:'')+'" aria-label="Valor de la regla"'+(!r||r.tipo==='nada'?' disabled':'')+'><span class="muted" id="'+id+'-u">'+(r&&r.tipo==='pct'?'%':'')+'</span></div>';
}
function wireRegla(id,guardar){
  const t=$('#'+id+'-t'),v=$('#'+id+'-v');
  const fin=()=>{const k=t.value;if(!k){guardar(null);return;}if(k==='nada'){guardar({tipo:'nada',v:0});return;}
    const n=num(v.value);if(n==null||isNaN(n)||n<0||(k==='pct'&&n>100)||(k!=='pct'&&n>10)){v.classList.add('bad');toast(k==='pct'?'Escribe un porcentaje de 0 a 100':'Escribe un número de 0 a 10');return;}guardar({tipo:k,v:n});};
  t.onchange=()=>{const k=t.value;v.disabled=!k||k==='nada';$('#'+id+'-u').textContent=k==='pct'?'%':'';if(k&&k!=='nada'&&v.value===''){v.value=k==='pct'?80:k==='max'?8:2;}fin();};
  v.onchange=fin;
}
function notaEf(g,a,aid){   // calificación que cuenta (con penalización si entregó tarde)
  const v=a.notas[aid];if(!esNum(v))return null;
  if(a.tipo==='exam'||!a.tarde||!a.tarde[aid])return v;
  const r=reglaDe(g,a),m=actMax(a);let x=v;
  if(r.tipo==='pct')x=v*r.v/100;else if(r.tipo==='max')x=Math.min(v,r.v/10*m);else if(r.tipo==='resta')x=Math.max(0,v-r.v/10*m);
  return Math.round(x*100)/100;
}
const esTarde=(a,aid)=>!!(a.tarde&&a.tarde[aid]);
function setPond(g,p,v){
  g.pond=g.pond||{};g.pond[p]=v;const pe=100-v,ex=examP(g,p);
  if(ex&&pe>0&&exMax(ex)!==pe){const old=exMax(ex);
    if(old>0)for(const k in ex.notas)if(esNum(ex.notas[k]))ex.notas[k]=Math.round(ex.notas[k]*pe/old*100)/100;
    ex.max=pe;return true;}
  return false;
}
function calFinal(total){const r=Math.round(total);return r<60?5:Math.min(10,Math.round(r/10));}
function calif(g,aid,p){
  const ac=actsP(g,p),ex=examP(g,p);
  const notas=ac.map(a=>notaEf(g,a,aid));
  const pend=ac.filter(a=>!esNum(a.notas[aid]));
  const n=ac.length,suma=notas.reduce((s,v)=>s+(esNum(v)?v:0),0);
  const pa=pondA(g,p),pe=100-pa;
  const V=valores(g,p).v;
  const escala=ac.reduce((s,a)=>{const v=notaEf(g,a,aid);return s+(esNum(v)?v/actMax(a)*V[a.id]:0);},0);   // Σ calificación/escala × valor
  const exam=ex&&esNum(ex.notas[aid])?(exMax(ex)>0?ex.notas[aid]/exMax(ex)*pe:0):null;
  const extra=+((g.extra[p]||{})[aid])||0;
  const hay=n>0||(ex&&pe>0);
  const total=escala+(exam||0);
  return {ac,notas,pend,n,pa,pe,escala:n?escala:null,exam,hayExam:!!ex&&pe>0,extra,total:hay?total:null,fin:hay?calFinal(total+extra*10):null};
}
function final(g,aid){const v=[];for(let p=1;p<=g.parciales;p++){const c=calif(g,aid,p);if(c.fin!=null&&c.hayExam)v.push(c.fin);}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function alertas(g,aid){
  const o=[],a=asis(g,aid);
  if(a.tot>=3&&a.pct<80)o.push('Asistencia '+Math.round(a.pct)+'%');
  const s=seguidas(g,aid);if(s>=3)o.push(s+' faltas seguidas');

  if(c.hayExam&&c.fin!=null&&c.fin<6)o.push('Parcial '+p+': '+c.fin);
  return o;
}

function pendientesYTarde(g,p){
  const h=hoy(),dias=Object.keys(g.asis).filter(f=>parcialDe(g,f)===p&&f<=h).sort();

    return [x,c.pend,c.ac.filter(a=>esTarde(a,x.id)),ff,rr];}).filter(z=>z[1].length||z[2].length||z[3].length);
}
function reporteOrientacion(g,p){
  const ac=actsP(g,p),pen=pendientesYTarde(g,p),total=activos(g).length;
  const nP=pen.filter(z=>z[1].length).length,nT=pen.filter(z=>z[2].length).length,nF=pen.filter(z=>z[3].length).length;

  let t='*Reporte para Orientación*\n'+matNom(g.materia)+' · Grupo '+g.nombre+(g.semestre?' · Semestre '+g.semestre:'')+'\nParcial '+p+' · '+fcorta(hoy())+'\n\n';
  t+='_Actividades del parcial:_\n'+ac.map((a,i)=>'Act '+(i+1)+': '+a.nombre+(a.fecha?' ('+fcorta(a.fecha)+')':'')).join('\n')+'\n\n';
  t+='Alumnos con actividades sin entregar: *'+nP+'* de '+total+'\nAlumnos con entregas a destiempo: *'+nT+'*\nAlumnos con faltas: *'+nF+'* (de '+dias+' clases registradas en el parcial hasta hoy)\n';
  pen.forEach(([x,pd,td,ff,rr],i)=>{
    t+='\n'+(i+1)+'. *'+x.nombre+'*\n';
    if(pd.length)t+='   ❌ No entregó: '+pd.map(numAct).join(', ')+'\n';
    if(td.length)t+='   ⏰ A destiempo: '+td.map(a=>numAct(a)+' ('+fcorta(a.tarde[x.id])+')').join(', ')+'\n';
    if(ff.length)t+='   📅 Faltas: *'+ff.length+'* ('+ff.map(fcorta).join(', ')+')'+(rr.length?' · Retardos: '+rr.length:'')+'\n';

  t+='\nGracias por su apoyo.';

    '<div class="row"><div style="flex:1;min-width:140px"><label class="f" for="o-t">Tipo</label><select class="in" id="o-t">'+Object.keys(TIPOS).map(t=>'<option>'+t+'</option>').join('')+'</select></div><div style="flex:1;min-width:140px"><label class="f" for="o-f">Fecha</label><input type="date" class="in" id="o-f" value="'+hoy()+'"></div></div>'+
    '<label class="f" for="o-x">Observación</label><textarea class="in" id="o-x" style="min-height:80px"></textarea><p><button class="btn" id="o-ok">Guardar observación</button></p></div>';
}
function wireObs(g,aid){
  $('#o-ok').onclick=()=>{const a=aid||$('#o-a').value,x=$('#o-x').value.trim();if(!a||!x){toast(aid?'Escribe la observación':'Elige al alumno y escribe la observación');return;}
    g.obs.push({id:uid(),aid:a,fecha:$('#o-f').value||hoy(),tipo:$('#o-t').value,texto:x});cambio();toast('Observación guardada');render();};
  app.querySelectorAll('[data-delobs]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta observación?')){g.obs=g.obs.filter(o=>o.id!==b.dataset.delobs);cambio();render();}});
}
function listaObs(g,obs,conNombre){
  if(!obs.length)return '<p class="muted">Sin observaciones.</p>';
  return [...obs].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(o=>{const a=g.alumnos.find(x=>x.id===o.aid);
    return '<div class="obs" style="--c:'+(TIPOS[o.tipo]||'#64748b')+'"><div class="h">'+fcorta(o.fecha)+' · '+esc(o.tipo)+(conNombre&&a?' · <a href="#a/'+g.id+'/'+a.id+'">'+esc(a.nombre)+'</a>':'')+' <button class="btn sm sec" style="padding:0 8px;float:right" data-delobs="'+o.id+'" aria-label="Eliminar">✕</button></div><div style="white-space:pre-wrap">'+esc(o.texto)+'</div></div>';}).join('');
}
function vNotas(g,head){app.innerHTML=head+formObs(g)+'<h3>Observaciones del grupo</h3>'+listaObs(g,g.obs,true);wireObs(g);}

/* ---------- exportar a TU formato de Excel ---------- */
function cargarJSZip(){
  if(window.JSZip)return Promise.resolve();
  return new Promise((ok,mal)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=ok;s.onerror=()=>mal(new Error('jszip'));document.head.appendChild(s);});
}
const HOJAS_P={1:'Calif. 1er Parcial',2:'Calif. 2do Parcial',3:'Calif. 3er Parcial'};
async function exportarFormato(g,cual){   // cual: 1|2|3 = un parcial · 'parciales' = los 3 · 'completo' = todo el formato
  toast('Preparando tu archivo…');
  try{
    await cargarJSZip();
    const parc=cual==='completo'?null:cual==='parciales'?[1,2,3].filter(q=>q<=g.parciales):[cual];
    const res=await llenarFormato(await formatoActual(),g,{parciales:parc});
    const pre=cual==='completo'?'Control_':cual==='parciales'?'Calificaciones_':'Calif_Parcial'+cual+'_';
    descargar(pre+archivoSeguro(matCorto(g.materia)+'_Grupo_'+g.nombre)+'.xlsx',res.blob);
    toast(res.avisos.length?res.avisos.join(' · '):'Listo: se descargó tu formato de Excel');
  }catch(e){console.error(e);toast(e.message==='sinhojas'?'Tu formato no tiene hojas de calificaciones ("Calif. 1er Parcial"…).':'No se pudo crear el archivo. Revisa tu conexión a internet.');}
}
/* formato propio subido por el profesor (se guarda en este equipo y en tu Hoja de Google) */
const LSF='seg_rrm_formato';
function b64aBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function bufAb64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function formatoGuardado(){try{const j=JSON.parse(localStorage.getItem(LSF)||'null');return j&&j.b64?j:null;}catch(e){return null;}}
async function formatoActual(){
  const f=formatoGuardado();if(f)return b64aBuf(f.b64);
  const r=await fetch('formato252.xlsx',{cache:'no-cache'});if(!r.ok)throw new Error('formato');return r.arrayBuffer();
}
async function revisarFormato(buf){   // → {ok, hojas:[…], msg}
  await cargarJSZip();
  const zip=await JSZip.loadAsync(buf);const wb=zip.file('xl/workbook.xml');if(!wb)return {ok:false,msg:'Ese archivo no es un Excel (.xlsx).'};
  const nombres=[...new DOMParser().parseFromString(await wb.async('string'),'application/xml').getElementsByTagName('sheet')].map(x=>x.getAttribute('name'));
  const cal=nombres.filter(n=>/CALIF|CAL\.|^CAL /.test(normal(n)));
  if(!cal.length)return {ok:false,msg:'No encontré hojas de calificaciones. Las hojas deben llamarse como "Calif. 1er Parcial", "Calif. 2do Parcial", "Calif. 3er Parcial".'};
  return {ok:true,hojas:cal,msg:'Encontré: '+cal.join(', ')+'.'};
}
window.llenarFormato=llenarFormato;
async function llenarFormato(buf,g,opts){
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const zip=await JSZip.loadAsync(buf),avisos=[];
  const sstF=zip.file('xl/sharedStrings.xml');
  const parse=t=>new DOMParser().parseFromString(t,'application/xml');
  const ser=d=>{let t=new XMLSerializer().serializeToString(d);if(!/^<\?xml/.test(t))t='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n'+t;return t;};
  const wb=parse(await zip.file('xl/workbook.xml').async('string'));
  const rels=parse(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
  const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const hojas={};[...wb.getElementsByTagNameNS(NS,'sheet')].forEach(s=>{let t=relMap[s.getAttributeNS(RNS,'id')];t=t.replace(/^\/?xl\//,'');hojas[s.getAttribute('name')]='xl/'+t;});
  const docs={};
  const NOMP={};   // hoja de calificaciones de cada parcial (aunque cambie un poco el nombre)
  const PAT={1:/(^|\D)1(\D|$)|PRIMER/,2:/(^|\D)2(\D|$)|SEGUND/,3:/(^|\D)3(\D|$)|TERCER/};
  for(let q=1;q<=3;q++){const ex=HOJAS_P[q];NOMP[q]=hojas[ex]?ex:Object.keys(hojas).find(n=>{const t=normal(n);return /CALIF|CAL\.|^CAL /.test(t)&&PAT[q].test(t);})||null;}
  const keep=opts&&opts.parciales?opts.parciales.map(q=>NOMP[q]).filter(Boolean):null;
  if(keep&&!keep.length)throw new Error('sinhojas');
  async function hoja(nombre){const p=hojas[nombre];if(!p)return null;if(!docs[p])docs[p]=parse(await zip.file(p).async('string'));return docs[p];}

  async function textos(d){const m={};for(const c of [...d.getElementsByTagNameNS(NS,'c')]){const ref=c.getAttribute('r');const rn=+ref.replace(/[A-Z]+/,'');if(rn>150)continue;const t=c.getAttribute('t');

      if(!x){[L.cE,L.cF,L.cG,L.cH,L.cI,L.cK,L.cL,L.cM].filter(Boolean).forEach(Lt=>poner(d,Lt+r,null));continue;}
      const pa=pondA(g,p);
      const VV=valores(g,p),simple=ac.length===n&&ac.every(a=>!esNum(a.valor)&&actMax(a)===10);
      const coef=a=>esNum(a.valor)?a.valor+'/'+actMax(a):'('+fpt(VV.resto)+'/'+VV.nAut+')/'+actMax(a);

  async function textoCelda(c){

/* --- importar lista de alumnos desde Excel --- */
const normal=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
const ENCAB=/^(N\.?P\.?|NO\.?|NUM|NOMBRE|NOMBRES|ALUMNO|ALUMNOS|NOMBRE COMPLETO.*|NOMBRE DEL ALUMNO|APELLIDOS?.*|ACTIVIDADES|FECHA|GENERO|SEXO|GRUPO.*|TOTAL.*)$/;
const esNombre=t=>{t=String(t).trim();return t.length>=6&&t.length<=80&&!/\d/.test(t)&&/^[A-Za-zÁÉÍÓÚÑÜáéíóúñü][A-Za-zÁÉÍÓÚÑÜáéíóúñü .'-]+$/.test(t)&&t.split(/\s+/).length>=2&&!ENCAB.test(normal(t))&&!/[=:]/.test(t);};
async function leerTabla(file){   // → [{nombre, cols:{A:[textos…]}}]
  if(/\.(csv|txt)$/i.test(file.name)){
    const txt=await file.text();const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':(txt.includes('\t')?'\t':',');
    const cols={};txt.split(/\r?\n/).forEach(l=>l.split(sep).forEach((v,i)=>{const L=String.fromCharCode(65+Math.min(i,25));(cols[L]=cols[L]||[]).push(v.replace(/^"|"$/g,'').trim());}));
    return [{nombre:file.name,cols}];
  }
  await cargarJSZip();
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const parse=t=>new DOMParser().parseFromString(t,'application/xml');
  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main',RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  let sst=[];const sf=zip.file('xl/sharedStrings.xml');
  if(sf)sst=[...parse(await sf.async('string')).getElementsByTagNameNS(NS,'si')].map(x=>[...x.getElementsByTagNameNS(NS,'t')].map(t=>t.textContent).join(''));
  const wb=parse(await zip.file('xl/workbook.xml').async('string'));
  const rels=parse(await zip.file('xl/_rels/workbook.xml.rels').async('string'));const rm={};
  [...rels.getElementsByTagName('Relationship')].forEach(r=>rm[r.getAttribute('Id')]=r.getAttribute('Target'));
  const out=[];
  for(const sh of [...wb.getElementsByTagNameNS(NS,'sheet')]){
    const t=(rm[sh.getAttributeNS(RNS,'id')]||'').replace(/^\/?xl\//,'');const f=zip.file('xl/'+t);if(!f)continue;
    const d=parse(await f.async('string'));const cols={};
    for(const c of [...d.getElementsByTagNameNS(NS,'c')]){
      const L=(c.getAttribute('r')||'').replace(/\d+/g,'');const ty=c.getAttribute('t');let v='';
      if(ty==='s'){const x=c.getElementsByTagNameNS(NS,'v')[0];v=x?sst[+x.textContent]||'':'';}
      else if(ty==='inlineStr')v=c.textContent;
      else if(ty==='str'){const x=c.getElementsByTagNameNS(NS,'v')[0];v=x?x.textContent:'';}
      if(v)(cols[L]=cols[L]||[]).push(v);
    }
    out.push({nombre:sh.getAttribute('name'),cols});
  }
  return out;
}
function mejorColumna(h){let best=null,bn=0;for(const L in h.cols){const n=h.cols[L].filter(esNombre).length;if(n>bn){bn=n;best=L;}}return [best,bn];}
function nombresDe(h,L){const vis=new Set(),r=[];for(const t of (h.cols[L]||[]))if(esNombre(t)){const k=normal(t);if(!vis.has(k)){vis.add(k);r.push(t.replace(/\s+/g,' ').trim().toUpperCase());}}return r;}
function importador(id,area,g){
  const fi=$('#'+id+'-file'),selW=$('#'+id+'-sel'),hs=$('#'+id+'-hoja'),cs=$('#'+id+'-col'),msg=$('#'+id+'-msg');let hojas=[];
  const ya=g?new Set(g.alumnos.map(a=>normal(a.nombre))):null;
  const poner=()=>{const h=hojas[+hs.value];let n=nombresDe(h,cs.value);let rep=0;if(ya){const k=n.length;n=n.filter(x=>!ya.has(normal(x)));rep=k-n.length;}
    area.value=n.join('\n');area.dispatchEvent(new Event('input'));
    msg.textContent=n.length?n.length+' alumnos encontrados'+(rep?' ('+rep+' ya estaban en el grupo)':'')+'. Revisa la lista y pulsa '+(g?'"Agregar"':'"Crear grupo"')+'.':(rep?'Los '+rep+' alumnos de esa lista ya están en el grupo.':'No encontré nombres en esa columna. Prueba con otra hoja o columna.');};
  const llenarCols=()=>{const h=hojas[+hs.value];const [b]=mejorColumna(h);cs.innerHTML=Object.keys(h.cols).sort((a,b2)=>a.length-b2.length||a.localeCompare(b2)).map(L=>'<option value="'+L+'"'+(L===b?' selected':'')+'>Columna '+L+' ('+h.cols[L].filter(esNombre).length+' nombres)</option>').join('');poner();};
  fi.onchange=async()=>{const f=fi.files[0];if(!f)return;msg.textContent='Leyendo '+f.name+'…';
    try{hojas=await leerTabla(f);
      if(!hojas.length)throw 0;
      let bi=0,bs=-1;hojas.forEach((h,i)=>{let [,n]=mejorColumna(h);if(/alumn|lista/i.test(h.nombre))n+=1000;if(n>bs){bs=n;bi=i;}});
      hs.innerHTML=hojas.map((h,i)=>'<option value="'+i+'"'+(i===bi?' selected':'')+'>Hoja: '+esc(h.nombre)+'</option>').join('');
      selW.classList.remove('hidden');llenarCols();
    }catch(e){console.error(e);msg.textContent='No pude leer ese archivo. Usa un Excel .xlsx o un .csv.';}
    fi.value='';};
  hs.onchange=llenarCols;cs.onchange=poner;
}

/* --- conexión y respaldo --- */
function vAjustes(){
  titulo('Ajustes',true);
  const PF=S.perfil||{};
  let h='';
  h+='<div class="card"><h3 style="margin-top:0">Primeros pasos (una sola vez por maestro)</h3><ol style="padding-left:20px;margin:6px 0">'+
    '<li><b>Copia la hoja plantilla</b> a tu Google Drive'+(PLANTILLA_URL?': <a class="btn sm xl" href="'+PLANTILLA_URL+'" target="_blank" rel="noopener">Hacer una copia</a>':' (pídele el enlace a quien te compartió la app) o crea una hoja nueva y pega <a href="codigo-hoja-google.txt" target="_blank" rel="noopener">este código</a> en Extensiones → Apps Script.')+'</li>'+
    '<li>En tu copia, menú <b>Seguimiento → Configurar mi clave</b> y acepta los permisos.</li>'+
    '<li>En <b>Extensiones → Apps Script</b>: <b>Implementar → Nueva implementación → Aplicación web</b>, "Quién tiene acceso: <b>Cualquier usuario</b>". Copia la dirección que termina en <b>/exec</b>.</li>'+
    '<li>Pégala abajo con tu clave y pulsa <b>Conectar</b>. Haz lo mismo en tu celular.</li></ol>'+
    '<p class="muted" style="margin:0">Tus datos quedan solo en tu Google Drive. Nadie más, ni quien te compartió la app, puede verlos.</p></div>';
  h+='<div class="card"><h3 style="margin-top:0">Docente</h3><label class="f" for="p-doc">Nombre del docente (aparece arriba en la aplicación)</label><input class="in" id="p-doc" value="'+esc(PF.docente||'')+'" placeholder="Ej. Juan Pérez López"><label class="f" for="p-esc">Escuela para el encabezado del Excel (opcional; vacío = la de tu formato)</label><input class="in" id="p-esc" value="'+esc(PF.escuela||'')+'" placeholder="Ej. Escuela Preparatoria Oficial Núm. 252"></div>'+'<div class="card"><h3 style="margin-top:0">Tu Hoja de Google</h3><p class="muted">Pega la dirección /exec de tu hoja y la clave que configuraste en ella. Así tus datos se guardan en tu Google Drive y aparecen en todos tus dispositivos.</p>'+
    '<label class="f" for="s-url">Dirección (termina en /exec)</label><input class="in" id="s-url" value="'+esc(C.url||'')+'" placeholder="https://script.google.com/macros/s/…/exec">'+
    '<label class="f" for="s-cl">Clave</label><input class="in" id="s-cl" type="password" value="'+esc(C.clave||'')+'" autocomplete="off">'+
    '<p class="row" style="margin-top:12px"><button class="btn" id="s-ok">Conectar</button>'+(C.url?'<button class="btn sec" id="s-des">Desconectar este equipo</button>':'')+'</p><p id="s-msg" class="muted"></p></div>';
  h+='<div class="card"><h3 style="margin-top:0">Respaldo</h3><p class="muted">Descarga una copia completa de todo (grupos, listas, calificaciones y observaciones). Guárdala de vez en cuando.</p><div class="row"><button class="btn sm sec" id="r-dl">Descargar respaldo</button><label class="btn sm sec" for="r-up" style="cursor:pointer">Restaurar respaldo</label><input type="file" id="r-up" accept=".json,application/json" class="hidden"></div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Cerrar sesión en este equipo</h3><p class="muted">Úsalo si compartes esta computadora o celular con otro maestro: borra de este equipo tus grupos, tu conexión y tu formato. En tu Hoja de Google no se borra nada.</p><button class="btn sm danger" id="s-salir">Cerrar sesión y borrar datos de este equipo</button></div>';
  h+='<p class="muted">Los datos de tus alumnos no se guardan en esta página: viven en este equipo y en tu Hoja de Google. Sin la clave nadie puede verlos.</p>';
  app.innerHTML=h;
  const guardaPerfil=()=>{S.perfil={docente:$('#p-doc').value.trim(),escuela:$('#p-esc').value.trim()};if(!S.perfil.escuela)delete S.perfil.escuela;cambio();titulo('Ajustes',true);toast('Datos guardados');};
  $('#p-doc').onchange=guardaPerfil;$('#p-esc').onchange=guardaPerfil;
  $('#s-ok').onclick=async()=>{
    const url=$('#s-url').value.trim(),cl=$('#s-cl').value;
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){$('#s-msg').textContent='La dirección debe empezar con https://script.google.com/ y terminar en /exec';return;}
    $('#s-msg').textContent='Probando conexión…';
    try{const r=await fetch(url,{method:'POST',body:JSON.stringify({clave:cl,accion:'cargar'})});const j=JSON.parse(await r.text());
      if(!j.ok){$('#s-msg').textContent=j.error==='sinclave'?'Tu hoja todavía no tiene clave: ábrela y usa el menú Seguimiento → Configurar mi clave.':j.error==='clave'?'La clave no coincide con la de tu hoja.':'El servidor respondió con un error.';return;}
      const cambia=C.url!==url;C.url=url;C.clave=cl;red=null;
      if(cambia){C.rev=0;C.dirty=false;}
      if(j.rev&&S.grupos.length&&cambia){conflicto=j;persist();mostrarConflicto();}
      else{persist();await bajar();}
      $('#s-msg').textContent='¡Conectado! '+(j.rev?'Se cargaron tus datos de la hoja.':'La hoja estaba vacía; se subirá lo que tengas aquí.');estado();
    }catch(e){$('#s-msg').textContent='No se pudo conectar. Revisa la dirección y que la implementación diga "Cualquier usuario".';}
  };
  if($('#s-des'))$('#s-des').onclick=()=>{if(confirm('¿Desconectar este equipo? Tus datos siguen en la hoja.')){delete C.url;delete C.clave;C.rev=0;C.dirty=false;persist();render();}};
  $('#s-salir').onclick=()=>{
    if(!C.url&&S.grupos.length&&!confirm('Tus datos NO están conectados a una Hoja de Google: si cierras sesión se pierden. Descarga antes un respaldo. ¿Borrar de todos modos?'))return;
    if(C.url&&C.dirty&&!confirm('Hay cambios que todavía no se guardan en tu Hoja de Google. Si sigues, se perderán. ¿Borrar de todos modos?'))return;
    if(!confirm('¿Cerrar sesión y borrar de este equipo tus grupos, conexión y formato?'))return;
    try{[LS,LSC,LSF].forEach(k=>localStorage.removeItem(k));}catch(e){}
    location.hash='';location.reload();};
  $('#r-dl').onclick=()=>descargar('Respaldo_seguimiento_'+hoy()+'.json',JSON.stringify(S,null,1),'application/json');
  $('#r-up').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.grupos))throw 0;
    if(confirm('Esto reemplaza todos tus datos actuales por los del respaldo ('+d.grupos.length+' grupos). ¿Continuar?')){S=migrar(d);cambio();toast('Respaldo restaurado');location.hash='';}}catch(x){toast('Ese archivo no es un respaldo válido');}};rd.readAsText(f);};
}

/* instalar como app y abrir sin internet */
let instalar=null;
const instalada=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instalar=e;if(!location.hash||location.hash==='#')render();});
window.addEventListener('appinstalled',()=>{instalar=null;toast('¡App instalada!');});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();bajar();
setInterval(()=>{if(C.url&&C.dirty&&!ocupado&&!conflicto)subir();},60000);
})();
